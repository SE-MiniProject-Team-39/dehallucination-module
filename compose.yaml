services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dam
      POSTGRES_USER: dam
      POSTGRES_PASSWORD: ${DAM_DB_PASSWORD:?Run python manage.py init or set DAM_DB_PASSWORD}
    volumes:
      - dam-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dam -d dam"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://dam:${DAM_DB_PASSWORD}@db:5432/dam
    depends_on:
      db:
        condition: service_healthy
volumes:
  dam-db:
